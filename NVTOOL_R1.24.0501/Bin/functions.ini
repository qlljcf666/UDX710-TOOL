[Functions]
;Name = Description
EnableArmLog  = Enable arm log
DisalbeArmLog = Disable arm log
;EnterAudioTestMode = Enter audio test mode

;special use, not change below
ClearCalibrationFlag= Clear calibration flag

[EnableArmLog]
nv_type\REF_PARAMETER\enable_arm_log=0x1

[DisalbeArmLog]
nv_type\REF_PARAMETER\enable_arm_log=0x0

[ClearCalibrationFlag]
;special use, not change below
gsm_research\gsm_calibration_param_remaining\adc\adc_reserved[7]=0x0
WCDMA_research\WCDMA_calibrationParam\w_cal_flag=0x0
LTE_remaining\LTE_cali_common\LTE_CaliParam_flag=0x0

[EnterAudioTestMode]
nv_type\REF_PARAMETER\enable_arm_log=0x0
nv_type\REF_PARAMETER\enable_arm_sleep=0x0
